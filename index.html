<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Editor</title>
  <meta name="description" content="A character-grid text editor — every cell holds one character and it stays where you put it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23217346'/%3E%3Cpath d='M5.5 3v10M10.5 3v10M3 5.5h10M3 10.5h10' stroke='%23fff' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="ribbon">
    <div class="bar tabrow">
      <span class="brand" title="Grid Editor" aria-label="Grid Editor">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
          <rect width="16" height="16" rx="3" fill="#217346"/>
          <path d="M5.5 3v10M10.5 3v10M3 5.5h10M3 10.5h10"
                stroke="#fff" stroke-width="1.2" fill="none"/>
        </svg>
      </span>
      <div class="ribbon-tabs" role="tablist" aria-label="Ribbon">
        <button id="tab-home" type="button" role="tab"
                aria-selected="true">Home</button>
        <button id="tab-insert" type="button" role="tab"
                aria-selected="false">Insert</button>
        <button id="tab-file" type="button" role="tab"
                aria-selected="false">File</button>
      </div>
      <span class="filewrap" title="File name (used when saving)">
        <input id="filename" value="untitled" spellcheck="false"
               autocomplete="off" aria-label="File name">
        <span class="fileext" aria-hidden="true">.grid</span>
      </span>
    </div>
    <div class="bar ribbonbar">
      <div id="pane-home" class="ribbon-pane">
        <button id="rb-cut" type="button" title="Cut (Ctrl/⌘+X)">Cut</button>
        <button id="rb-copy" type="button"
                title="Copy (Ctrl/⌘+C)">Copy</button>
        <button id="rb-paste" type="button"
                title="Paste (Ctrl/⌘+V)">Paste</button>
        <span class="rsep"></span>
        <button id="rb-bold" type="button" class="rstyle"
                title="Bold (Ctrl/⌘+B)" aria-pressed="false"><b>B</b></button>
        <button id="rb-italic" type="button" class="rstyle"
                title="Italic (Ctrl/⌘+I)"
                aria-pressed="false"><i>I</i></button>
        <button id="rb-underline" type="button" class="rstyle"
                title="Underline (Ctrl/⌘+U)"
                aria-pressed="false"><u>U</u></button>
        <button id="rb-strike" type="button" class="rstyle"
                title="Strikethrough (Ctrl/⌘+5)"
                aria-pressed="false"><s>S</s></button>
      </div>
      <div id="pane-insert" class="ribbon-pane" hidden>
        <button id="btn-image" type="button"
                title="Insert a picture — or paste / drop one">
          Picture…</button>
      </div>
      <div id="pane-file" class="ribbon-pane" hidden>
        <button id="btn-new" type="button">New</button>
        <button id="btn-open" type="button">Open…</button>
        <button id="btn-save" type="button">Save</button>
        <button id="btn-export" type="button">Export .txt</button>
      </div>
      <span class="spacer"></span>
      <button id="btn-help" type="button" title="F1">Keyboard shortcuts</button>
    </div>
  </header>

  <div class="formulabar">
    <span id="pos" class="namebox">R0C0</span>
    <span class="fx" aria-hidden="true">fx</span>
    <span id="cell-preview" class="cellbox" aria-label="Current cell contents"></span>
  </div>

  <main>
    <canvas id="grid" tabindex="0"
            aria-label="Grid canvas. Type to place characters; arrow keys move the cursor."></canvas>
    <div id="find-bar" class="find-bar" hidden>
      <input id="find-input" type="text" placeholder="Find"
             spellcheck="false" autocomplete="off" aria-label="Find text">
      <span id="find-count" class="find-count"></span>
      <button id="find-prev" type="button"
              title="Previous match (Shift+Enter)"
              aria-label="Previous match">↑</button>
      <button id="find-next" type="button" title="Next match (Enter)"
              aria-label="Next match">↓</button>
      <button id="find-case" type="button" class="find-toggle"
              title="Match case" aria-pressed="false">Aa</button>
      <button id="find-word" type="button" class="find-toggle"
              title="Whole words" aria-pressed="false">Word</button>
      <button id="find-all" type="button" class="find-toggle"
              title="Highlight all matches" aria-pressed="true">All</button>
      <button id="find-close" type="button" title="Close (Esc)"
              aria-label="Close find">×</button>
    </div>
  </main>

  <footer class="bar bottombar">
    <div id="sheet-tabs" class="sheet-tabs"></div>
    <button id="btn-add-sheet" type="button" title="New sheet"
            aria-label="New sheet">+</button>
    <span class="bsep"></span>
    <span id="mode">Ready</span>
    <span id="bold-flag" hidden>Bold</span>
    <span class="spacer"></span>
    <span id="save-state">New sheet</span>
    <div class="viewmode" role="group" aria-label="View mode">
      <button id="view-infinite" type="button" aria-pressed="false"
              title="Infinite canvas">Infinite</button>
      <button id="view-paged" type="button" aria-pressed="true"
              title="A4 pages — typing wraps at the margin">Pages</button>
    </div>
    <button id="btn-spell" type="button" aria-pressed="false"
            title="Check spelling on character rows">Spelling</button>
    <div class="zoom" role="group" aria-label="Zoom">
      <button id="btn-zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="btn-zoom-reset" type="button" title="Reset zoom to 100%">
        <span id="zoom-level">100%</span>
      </button>
      <button id="btn-zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>
  </footer>

  <div id="ctx-menu" class="menu" hidden>
    <button type="button" data-act="cut">Cut</button>
    <button type="button" data-act="copy">Copy</button>
    <button type="button" data-act="paste">Paste</button>
    <hr>
    <button type="button" data-act="bold">Bold</button>
    <button type="button" data-act="italic">Italic</button>
    <button type="button" data-act="underline">Underline</button>
    <button type="button" data-act="strike">Strikethrough</button>
    <hr>
    <button type="button" data-act="clear">Clear contents</button>
    <button type="button" data-act="deselect">Deselect</button>
  </div>

  <div id="drop-scrim" class="drop-scrim" hidden>
    <div class="drop-card">
      <span id="drop-title">Drop to open</span>
      <small id="drop-sub">.grid files</small>
    </div>
  </div>

  <div id="help" class="help-scrim" hidden>
    <section class="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <header class="help-head">
        <h2 id="help-title">Keyboard shortcuts</h2>
        <div id="help-tabs" class="help-tabs" role="tablist" aria-label="Show shortcuts for">
          <button type="button" role="tab" data-platform="mac">macOS</button>
          <button type="button" role="tab" data-platform="win">Windows</button>
          <button type="button" role="tab" data-platform="linux">Linux</button>
        </div>
        <button id="btn-help-close" type="button" aria-label="Close">×</button>
      </header>
      <div id="help-body" class="help-body"></div>
    </section>
  </div>

  <div id="print-pages" aria-hidden="true"></div>

  <input type="file" id="file-input" accept=".grid,.json,application/json" hidden>
  <input type="file" id="image-input" accept="image/*" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
